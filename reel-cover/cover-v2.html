<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>Million Dirham Cover</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;700;900&family=IBM+Plex+Sans+Arabic:wght@500;600&family=Inter:wght@900&display=swap" rel="stylesheet">
<style>
  :root{--bg1:#042a22;--bg2:#06463a;--gold:#f7c948;--gold2:#e0a82e;--mint:#7ff0c9;--aqua:#2ec5d3;--ink:#03140f}
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:1080px;height:1920px;overflow:hidden;background:var(--bg1)}
  .c{position:relative;width:1080px;height:1920px;overflow:hidden;font-family:'Cairo',sans-serif;color:#fff;
     background:
       radial-gradient(700px 600px at 50% 33%, rgba(247,201,72,.28), transparent 65%),
       radial-gradient(900px 700px at 90% 95%, rgba(46,197,211,.22), transparent 60%),
       linear-gradient(180deg,#06463a 0%,#042a22 50%,#021712 100%)}
  .rays{position:absolute;left:50%;top:640px;width:1800px;height:1800px;transform:translate(-50%,-50%);opacity:.10;
        background:repeating-conic-gradient(from 0deg,#f7c948 0 6deg,transparent 6deg 18deg);
        -webkit-mask:radial-gradient(circle,#000 0,transparent 60%);mask:radial-gradient(circle,#000 0,transparent 60%)}
  .bill{position:absolute;width:300px;height:140px;border-radius:14px;
        background:linear-gradient(135deg,#9be7b4,#3fae78);border:5px solid rgba(255,255,255,.55);
        box-shadow:0 25px 50px rgba(0,0,0,.45)}
  .bill::after{content:"1000";position:absolute;inset:0;display:grid;place-items:center;font:900 54px Inter;color:rgba(4,42,34,.55)}
  .bill::before{content:"";position:absolute;inset:14px;border:3px dashed rgba(4,42,34,.3);border-radius:8px}

  .pill{position:absolute;top:300px;left:50%;transform:translateX(-50%);white-space:nowrap;
        display:flex;align-items:center;gap:18px;font-family:'IBM Plex Sans Arabic';font-weight:600;font-size:36px;
        padding:16px 36px;border-radius:999px;background:rgba(0,0,0,.35);border:2px solid rgba(247,201,72,.6)}
  .pill svg{width:54px;height:36px;border-radius:5px}
  .pill b{color:var(--gold)}

  .ma3ak{position:absolute;top:420px;width:100%;text-align:center;font-weight:700;font-size:76px;color:rgba(255,255,255,.9)}
  .num{position:absolute;top:500px;width:100%;text-align:center;direction:ltr;font:900 178px/1 Inter;letter-spacing:-5px;
       background:linear-gradient(180deg,#fff6cf 0%,#f7c948 45%,#d9961d 100%);-webkit-background-clip:text;background-clip:text;color:transparent;
       filter:drop-shadow(0 12px 0 rgba(0,0,0,.35)) drop-shadow(0 30px 50px rgba(0,0,0,.4))}
  .aed{position:absolute;top:705px;left:50%;transform:translateX(-50%) rotate(-2deg);
       background:#fff;color:var(--ink);font-weight:900;font-size:78px;line-height:1;padding:14px 56px 26px;border-radius:20px;
       box-shadow:0 14px 0 rgba(0,0,0,.25)}

  .q{position:absolute;top:870px;width:100%;text-align:center;font-weight:900;font-size:96px;line-height:1.15;
     text-shadow:0 8px 30px rgba(0,0,0,.5)}
  .q span{color:var(--gold)}

  .row{position:absolute;top:1190px;left:90px;right:90px;display:flex;justify-content:space-between;align-items:flex-end}
  .p{position:relative;width:260px;height:270px;border-radius:34px;background:rgba(255,255,255,.07);border:2px solid rgba(255,255,255,.18);
     display:flex;align-items:flex-end;justify-content:center;padding-bottom:26px}
  .p.mid{height:320px;background:rgba(247,201,72,.14);border-color:var(--gold)}
  .p svg{height:190px}
  .p.mid svg{height:235px}
  .qm{position:absolute;top:-46px;left:50%;transform:translateX(-50%);width:92px;height:92px;border-radius:50%;
      background:var(--gold);color:var(--ink);font:900 62px/92px Cairo;text-align:center;box-shadow:0 10px 24px rgba(0,0,0,.4)}
  .p:not(.mid) .qm{background:#fff;width:76px;height:76px;font-size:50px;line-height:76px;top:-38px}

  .bottom{position:absolute;top:1555px;left:90px;right:90px;display:flex;align-items:center;gap:30px}
  .av{flex:none;width:150px;height:150px;border-radius:50%;padding:6px;background:linear-gradient(135deg,var(--gold),var(--mint))}
  .av img,.av .ph{width:100%;height:100%;border-radius:50%;object-fit:cover;display:block;background:#0b5a49}
  .av .ph{display:grid;place-items:center}
  .bt{font-family:'IBM Plex Sans Arabic';font-weight:600;font-size:40px;line-height:1.35}
  .bt small{display:block;font-size:30px;color:rgba(255,255,255,.65);font-weight:500}
  .bt b{color:var(--mint)}
</style>
</head>
<body>
<div class="c">
  <div class="rays"></div>
  <div class="bill" style="left:-150px;top:860px;transform:rotate(-24deg)"></div>
  <div class="bill" style="right:-170px;top:1000px;transform:rotate(18deg)"></div>
  <div class="bill" style="left:-60px;top:150px;transform:rotate(12deg);opacity:.5;filter:blur(3px)"></div>
  <div class="bill" style="right:-60px;top:140px;transform:rotate(-10deg);opacity:.45;filter:blur(4px)"></div>

  <div class="pill">
    <svg viewBox="0 0 12 6"><rect width="12" height="2" fill="#00732f"/><rect y="2" width="12" height="2" fill="#fff"/><rect y="4" width="12" height="2" fill="#000"/><rect width="3" height="6" fill="#ff0000"/></svg>
    دراسة حقيقية على <b>196</b> شخص
  </div>

  <div class="ma3ak">معك</div>
  <div class="num">1,000,000</div>
  <div class="aed">درهم</div>

  <div class="q">على أي منتج<br><span>بتراهن؟</span></div>

  <div class="row">
    <!-- spray -->
    <div class="p"><div class="qm">?</div>
      <svg viewBox="0 0 160 300"><path d="M50 20h55v30H70v18h-20z" fill="#e8f7fb"/><path d="M105 28h35l-10 14h-25z" fill="#2ec5d3"/>
      <rect x="45" y="66" width="40" height="34" rx="6" fill="#2ec5d3"/>
      <path d="M40 100h50q20 0 24 30l10 140q2 24-22 24H40q-24 0-22-24l8-140q4-30 14-30z" fill="#bff3ff"/>
      <rect x="36" y="160" width="72" height="80" rx="12" fill="#0a7e94"/><circle cx="72" cy="200" r="16" fill="#7ff0c9"/></svg></div>
    <!-- liquid bottle -->
    <div class="p mid"><div class="qm">?</div>
      <svg viewBox="0 0 400 560"><rect x="120" y="0" width="120" height="70" rx="14" fill="#f7c948"/><rect x="135" y="60" width="90" height="30" rx="6" fill="#d9a917"/>
      <path d="M250 110h70a40 40 0 0 1 40 40v120a40 40 0 0 1-40 40h-30" fill="none" stroke="#e9fbff" stroke-width="34" stroke-linecap="round"/>
      <path d="M110 90h150q40 0 55 50l25 90q10 40 10 80v180q0 70-70 70H90q-70 0-70-70V310q0-40 10-80l25-90q15-50 55-50z" fill="#f4fdff"/>
      <rect x="60" y="290" width="260" height="190" rx="26" fill="#2ec5d3"/><circle cx="190" cy="355" r="36" fill="#f7c948"/>
      <path d="M173 357l12 12 22-24" stroke="#042a22" stroke-width="10" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="100" y="410" width="180" height="16" rx="8" fill="rgba(255,255,255,.85)"/></svg></div>
    <!-- powder box -->
    <div class="p"><div class="qm">?</div>
      <svg viewBox="0 0 200 260"><path d="M20 40l20-25h120l20 25z" fill="#ff8a65"/><rect x="20" y="40" width="160" height="210" rx="10" fill="#ff6b4a"/>
      <rect x="60" y="20" width="80" height="14" rx="7" fill="#fff"/>
      <circle cx="100" cy="130" r="48" fill="#fff"/><circle cx="100" cy="130" r="34" fill="#2ec5d3"/>
      <circle cx="88" cy="118" r="8" fill="#fff"/><rect x="45" y="200" width="110" height="16" rx="8" fill="rgba(255,255,255,.8)"/></svg></div>
  </div>

  <div class="bottom">
    <div class="av"><img src="me.jpg" alt="" onerror="this.outerHTML='<div class=ph><svg width=90 viewBox=&quot;0 0 24 24&quot; fill=&quot;#7ff0c9&quot;><circle cx=12 cy=8 r=4.5 /><path d=&quot;M3 22c0-5 4-8 9-8s9 3 9 8z&quot;/></svg></div>'"></div>
    <div class="bt">قبل ما تستثمر ولا درهم…<br><b>شوف الأرقام ←</b></div>
  </div>
</div>
</body>
</html>
