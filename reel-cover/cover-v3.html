<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>Million Dirham Cover</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@700;800;900&family=IBM+Plex+Sans+Arabic:wght@500;600;700&family=Inter:wght@800;900&display=swap" rel="stylesheet">
<style>
  :root{--bg:#eeebe4;--ink:#1d242a;--slate:#374246;--green:#11815d;--mint:#8fe3bd;--line:#d9d3c4}
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:1080px;height:1920px;overflow:hidden;background:var(--bg)}
  .c{position:relative;width:1080px;height:1920px;overflow:hidden;font-family:'Cairo',sans-serif;color:var(--ink);
     background:radial-gradient(900px 600px at 50% 22%,#f9f7f2 0%,transparent 70%),var(--bg)}
  .pill{position:absolute;top:255px;left:50%;transform:translateX(-50%);white-space:nowrap;display:flex;align-items:center;gap:16px;
        background:#fff;border-radius:999px;padding:14px 34px;font-family:'IBM Plex Sans Arabic';font-weight:700;font-size:34px;
        box-shadow:0 6px 24px rgba(29,36,42,.10)}
  .pill svg{width:52px;height:34px;border-radius:4px}
  .pill b{color:var(--green)}
  .ma3ak{position:absolute;top:350px;width:100%;text-align:center;font-weight:800;font-size:70px;color:var(--slate)}
  .num{position:absolute;top:440px;width:100%;text-align:center;direction:ltr;font:900 172px/1 Inter;letter-spacing:-3px;color:var(--ink)}
  .cur{position:absolute;top:640px;width:100%;display:flex;justify-content:center;align-items:center;gap:22px}
  .cur .d{font-weight:900;font-size:92px;line-height:1;color:var(--green)}
  .cur .aed{direction:ltr;font:800 34px Inter;letter-spacing:4px;color:#6b7378;border:2px solid var(--line);background:#f7f5f0;border-radius:10px;padding:6px 16px}
  .scene{position:absolute;top:770px;left:40px;width:1000px;
         -webkit-mask:linear-gradient(180deg,transparent 0,#000 8%,#000 88%,transparent 100%),linear-gradient(90deg,transparent 0,#000 6%,#000 94%,transparent 100%);-webkit-mask-composite:source-in;mask:linear-gradient(180deg,transparent 0,#000 8%,#000 88%,transparent 100%),linear-gradient(90deg,transparent 0,#000 6%,#000 94%,transparent 100%);mask-composite:intersect}
  .qm{position:absolute;border-radius:50%;background:var(--ink);color:#fff;text-align:center;font-weight:900;
      box-shadow:0 10px 24px rgba(29,36,42,.3);border:5px solid #fff}
  .qm.big{width:110px;height:110px;font-size:74px;line-height:92px;background:var(--green)}
  .qm.sm{width:82px;height:82px;font-size:52px;line-height:66px}
  .box{position:absolute;top:1370px;left:60px;right:60px;background:var(--slate);border-radius:30px;padding:34px 40px 42px;
       text-align:center;color:#fff;font-weight:900;font-size:92px;line-height:1.15;box-shadow:0 20px 50px rgba(29,36,42,.25)}
  .box span{color:var(--mint)}
  .bottom{position:absolute;top:1590px;left:60px;right:60px;display:flex;align-items:center;gap:28px}
  .av{flex:none;width:150px;height:150px;border-radius:50%;padding:6px;background:#fff;box-shadow:0 0 0 4px var(--green),0 10px 30px rgba(29,36,42,.2)}
  .av img{width:100%;height:100%;border-radius:50%;display:block}
  .bt{font-family:'IBM Plex Sans Arabic';font-weight:600;font-size:42px;line-height:1.4;color:var(--slate)}
  .bt b{color:var(--green);font-weight:700}
</style>
</head>
<body>
<div class="c">
  <div class="pill">
    <svg viewBox="0 0 12 6"><rect width="12" height="2" fill="#00732f"/><rect y="2" width="12" height="2" fill="#fff"/><rect y="4" width="12" height="2" fill="#000"/><rect width="3" height="6" fill="#ff0000"/></svg>
    دراسة حقيقية على <b>196</b> شخص بالإمارات
  </div>
  <div class="ma3ak">معك</div>
  <div class="num">1,000,000</div>
  <div class="cur"><span class="d">درهم</span><span class="aed">AED</span></div>

  <img class="scene" src="scene.png" alt="">
  <div class="qm big" style="left:495px;top:800px">؟</div>
  <div class="qm sm" style="left:112px;top:925px">؟</div>
  <div class="qm sm" style="left:870px;top:1185px">؟</div>

  <div class="box">على أي منتج <span>بتراهن؟</span></div>

  <div class="bottom">
    <div class="av"><img src="me.png" alt=""></div>
    <div class="bt">قبل ما تستثمر ولا درهم…<br><b>شوف الأرقام ←</b></div>
  </div>
</div>
</body>
</html>
