<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>Million Dirham Cover</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@700;800;900&family=IBM+Plex+Sans+Arabic:wght@500;600;700&family=Inter:wght@800;900&display=swap" rel="stylesheet">
<style>
  :root{--bg:#f1ede4;--ink:#161d22;--slate:#3a454a;--green:#0f8a60;--green2:#0b6b4b;--mint:#9be8c6;--gold:#f2b632}
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:1080px;height:1920px;overflow:hidden;background:var(--bg)}
  .c{position:relative;width:1080px;height:1920px;overflow:hidden;font-family:'Cairo',sans-serif;color:var(--ink);
     background:
       radial-gradient(620px 520px at 50% 1010px, rgba(15,138,96,.16), transparent 70%),
       radial-gradient(1000px 700px at 50% 380px, #fbf9f4 0%, transparent 70%),
       var(--bg)}
  .dots{position:absolute;inset:0;opacity:.5;
        background-image:radial-gradient(rgba(58,69,74,.18) 2px,transparent 2.5px);background-size:34px 34px;
        -webkit-mask:radial-gradient(700px 600px at 50% 1000px,#000 20%,transparent 75%);mask:radial-gradient(700px 600px at 50% 1000px,#000 20%,transparent 75%)}
  /* floating bills */
  .bill{position:absolute;width:250px;height:118px;border-radius:14px;background:linear-gradient(135deg,#d9efe3,#a9dcc3);
        border:4px solid #fff;box-shadow:0 18px 36px rgba(22,29,34,.18)}
  .bill::before{content:"";position:absolute;inset:12px;border:2px dashed rgba(11,107,75,.35);border-radius:8px}
  .bill::after{content:"1000";position:absolute;inset:0;display:grid;place-items:center;font:900 44px Inter;color:rgba(11,107,75,.45)}

  .pill{position:absolute;top:190px;left:50%;transform:translateX(-50%);white-space:nowrap;display:flex;align-items:center;gap:16px;
        background:#fff;border-radius:999px;padding:14px 32px 14px 36px;font-family:'IBM Plex Sans Arabic';font-weight:700;font-size:33px;
        box-shadow:0 8px 28px rgba(22,29,34,.10)}
  .pill svg{width:50px;height:33px;border-radius:4px}
  .pill b{color:var(--green)}
  .live{width:14px;height:14px;border-radius:50%;background:#e5484d;box-shadow:0 0 0 6px rgba(229,72,77,.18)}

  .ma3ak{position:absolute;top:320px;width:100%;text-align:center;font-weight:800;font-size:58px;color:var(--slate)}
  .num{position:absolute;top:400px;width:100%;text-align:center;direction:ltr;font:900 146px/1 Inter;letter-spacing:-2px;color:var(--ink)}
  .num i{font-style:normal;color:var(--green)}
  .aed{position:absolute;top:590px;left:50%;transform:translateX(-50%) rotate(-3deg);display:flex;align-items:center;gap:18px;
       background:var(--green);color:#fff;border-radius:22px;padding:6px 40px 18px;box-shadow:0 12px 0 var(--green2),0 24px 40px rgba(15,138,96,.35)}
  .aed b{font-weight:900;font-size:70px;line-height:1.1}
  .aed span{direction:ltr;font:800 28px Inter;letter-spacing:3px;background:rgba(255,255,255,.18);border-radius:8px;padding:4px 12px;margin-top:10px}

  /* product podium */
  .row{position:absolute;top:790px;left:80px;right:80px;height:400px}
  .card{position:absolute;bottom:0;width:250px;height:275px;border-radius:36px;background:linear-gradient(180deg,#ffffff,#f6f3ec);
        box-shadow:0 30px 60px rgba(22,29,34,.14), inset 0 -6px 0 rgba(22,29,34,.04);display:flex;align-items:flex-end;justify-content:center;padding-bottom:30px}
  .card.l{right:0;transform:rotate(4deg)}
  .card.r{left:0;transform:rotate(-4deg)}
  .card.m{left:50%;margin-left:-150px;width:300px;height:360px;z-index:2;
          box-shadow:0 0 0 5px var(--green),0 40px 80px rgba(15,138,96,.30)}
  .card svg{display:block}
  .q{position:absolute;top:-44px;left:50%;transform:translateX(-50%);width:88px;height:88px;border-radius:50%;
     background:var(--ink);color:#fff;font:900 56px/78px Cairo;text-align:center;border:5px solid #fff;box-shadow:0 10px 24px rgba(22,29,34,.3)}
  .card.m .q{width:112px;height:112px;top:-56px;font-size:74px;line-height:98px;background:var(--green)}
  .shadow{position:absolute;bottom:26px;left:50%;transform:translateX(-50%);width:70%;height:22px;border-radius:50%;background:rgba(22,29,34,.12);filter:blur(6px)}

  .head{position:absolute;top:1250px;width:100%;text-align:center;white-space:nowrap;font-weight:900;font-size:82px;line-height:1.3;color:var(--ink)}
  .head .hl{position:relative;display:inline-block;color:#fff;padding:0 22px 6px;margin-right:6px}
  .head .hl::before{content:"";position:absolute;inset:16px 0 0 0;background:var(--ink);border-radius:22px;transform:rotate(1.5deg);z-index:-1}
  .head .hl{isolation:isolate}
  .head .hl em{font-style:normal;color:var(--mint)}

  .presenter{position:absolute;top:1420px;left:50px;right:50px;display:flex;align-items:center;gap:26px}
  .av{flex:none;position:relative;width:236px;height:236px;border-radius:50%;padding:8px;background:#fff;
      box-shadow:0 0 0 5px var(--green),0 18px 40px rgba(22,29,34,.25)}
  .av img{width:100%;height:100%;border-radius:50%;display:block}
  .bubble{position:relative;background:#fff;border-radius:30px;flex:1;padding:26px 36px 30px;box-shadow:0 14px 36px rgba(22,29,34,.12);
          font-family:"IBM Plex Sans Arabic";font-weight:700;font-size:48px;line-height:1.5;color:var(--ink)}
  .bubble::before{content:"";position:absolute;right:-18px;top:50%;margin-top:-18px;border:18px solid transparent;border-left-color:#fff;border-right:0}
  .bubble b{color:var(--green);font-weight:700;display:inline-flex;align-items:center;gap:12px}
  .play{width:54px;height:54px;border-radius:50%;background:var(--green);display:inline-grid;place-items:center}
</style>
</head>
<body>
<div class="c">
  <div class="dots"></div>
  <div class="bill" style="left:-70px;top:120px;transform:rotate(-16deg);opacity:.75"></div>
  <div class="bill" style="right:-150px;top:640px;transform:rotate(20deg)"></div>
  <div class="bill" style="left:-110px;top:640px;transform:rotate(14deg);opacity:.9"></div>
  <div class="bill" style="right:-60px;top:1720px;transform:rotate(-10deg);opacity:.6"></div>

  <div class="pill">
    <span class="live"></span>
    دراسة حقيقية
    <svg viewBox="0 0 12 6"><rect width="12" height="2" fill="#00732f"/><rect y="2" width="12" height="2" fill="#fff"/><rect y="4" width="12" height="2" fill="#000"/><rect width="3" height="6" fill="#ff0000"/></svg>
  </div>

  <div class="ma3ak">معك</div>
  <div class="num">1<i>,</i>000<i>,</i>000</div>
  <div class="aed"><b>درهم</b><span>AED</span></div>

  <div class="row">
    <!-- spray (right) -->
    <div class="card l"><div class="shadow"></div><div class="q">؟</div>
      <svg width="118" height="227" viewBox="0 0 130 250">
        <defs><linearGradient id="sp" x1="0" x2="1"><stop offset="0" stop-color="#4f8ff0"/><stop offset=".5" stop-color="#7fb2ff"/><stop offset="1" stop-color="#3d74d6"/></linearGradient></defs>
        <path d="M30 8h62l16 14v18H56v18H38V40H30z" fill="#f4f2ec" stroke="#d9d4c8" stroke-width="2"/>
        <path d="M40 40c-6 14-10 24-10 30" stroke="#d9d4c8" stroke-width="6" fill="none" stroke-linecap="round"/>
        <rect x="40" y="56" width="40" height="22" rx="5" fill="#f4f2ec" stroke="#d9d4c8" stroke-width="2"/>
        <path d="M38 78h44q14 0 18 22l8 118q2 26-24 26H38q-26 0-24-26l8-118q4-22 16-22z" fill="url(#sp)"/>
        <rect x="28" y="140" width="66" height="70" rx="10" fill="#fff"/>
        <circle cx="61" cy="162" r="12" fill="#3d74d6"/><path d="M55 162l4 4 8-8" stroke="#fff" stroke-width="3.5" fill="none" stroke-linecap="round"/>
        <rect x="40" y="184" width="42" height="6" rx="3" fill="#3a454a"/><rect x="46" y="196" width="30" height="5" rx="2.5" fill="#b9bfc2"/>
        <path d="M30 100q-6 50-4 100" stroke="rgba(255,255,255,.55)" stroke-width="7" fill="none" stroke-linecap="round"/>
      </svg></div>

    <!-- jug (middle) -->
    <div class="card m"><div class="shadow"></div><div class="q">؟</div>
      <svg width="210" height="274" viewBox="0 0 230 300">
        <defs><linearGradient id="jg" x1="0" x2="1"><stop offset="0" stop-color="#0b6b4b"/><stop offset=".35" stop-color="#16a072"/><stop offset="1" stop-color="#0a5e42"/></linearGradient>
        <linearGradient id="cp" x1="0" x2="1"><stop offset="0" stop-color="#e9e4d6"/><stop offset=".5" stop-color="#fbf9f2"/><stop offset="1" stop-color="#d9d2c0"/></linearGradient></defs>
        <rect x="30" y="4" width="78" height="44" rx="8" fill="url(#cp)"/>
        <g stroke="#cfc7b3" stroke-width="2"><line x1="42" y1="10" x2="42" y2="44"/><line x1="54" y1="10" x2="54" y2="44"/><line x1="66" y1="10" x2="66" y2="44"/><line x1="78" y1="10" x2="78" y2="44"/><line x1="90" y1="10" x2="90" y2="44"/></g>
        <path d="M22 60q0-14 16-14h80l10 10h60q22 0 30 24l8 30v170q0 18-18 18H34q-16 0-16-18V60z" fill="url(#jg)"/>
        <rect x="150" y="70" width="44" height="70" rx="14" fill="#f1ede4"/>
        <rect x="44" y="150" width="150" height="120" rx="14" fill="#f8f6f0"/>
        <circle cx="119" cy="190" r="26" fill="#0b6b4b"/>
        <path d="M102 184q8-6 17 0t17 0M102 194q8-6 17 0t17 0" stroke="#bfe9d6" stroke-width="3.5" fill="none" stroke-linecap="round"/>
        <rect x="74" y="232" width="90" height="7" rx="3.5" fill="#3a454a"/><rect x="88" y="246" width="62" height="5" rx="2.5" fill="#b9bfc2"/>
        <path d="M32 80v170" stroke="rgba(255,255,255,.28)" stroke-width="9" stroke-linecap="round"/>
      </svg></div>

    <!-- tub (left) -->
    <div class="card r"><div class="shadow"></div><div class="q">؟</div>
      <svg width="176" height="185" viewBox="0 0 190 200">
        <defs><linearGradient id="tb" x1="0" x2="1"><stop offset="0" stop-color="#e8e6e1"/><stop offset=".5" stop-color="#ffffff"/><stop offset="1" stop-color="#dcd9d2"/></linearGradient></defs>
        <rect x="8" y="10" width="174" height="34" rx="8" fill="#0f8a60"/><rect x="8" y="34" width="174" height="10" fill="#0b6b4b"/>
        <path d="M18 44h154l-12 148q-1 8-10 8H40q-9 0-10-8z" fill="url(#tb)"/>
        <rect x="38" y="64" width="114" height="84" rx="10" fill="#fff" stroke="#e6e2d8" stroke-width="2"/>
        <g><circle cx="62" cy="88" r="13" fill="#0f8a60"/><circle cx="95" cy="88" r="13" fill="#4f8ff0"/><circle cx="128" cy="88" r="13" fill="#0f8a60"/>
        <circle cx="78" cy="118" r="13" fill="#4f8ff0"/><circle cx="111" cy="118" r="13" fill="#0f8a60"/></g>
        <rect x="64" y="166" width="62" height="6" rx="3" fill="#b9bfc2"/>
      </svg></div>
  </div>

  <div class="head">على أي منتج <span class="hl"><em>بتراهن؟</em></span></div>

  <div class="presenter">
    <div class="av"><img src="me.png" alt=""></div>
    <div class="bubble">قبل ما تستثمر ولا درهم…<br>
      <b><span class="play"><svg width="18" height="18" viewBox="0 0 10 10"><path d="M2 1l7 4-7 4z" fill="#fff"/></svg></span>شوف أرقام الدراسة</b></div>
  </div>
</div>
</body>
</html>
