<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>Detergent Study Reel Cover</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@500;700;900&family=IBM+Plex+Sans+Arabic:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#06223a; --deep:#0a3d62; --aqua:#2ec5d3; --mint:#b8f3e6; --foam:#eafcff; --lemon:#ffd84d;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:1080px;height:1920px;overflow:hidden;background:var(--ink)}
  .c{position:relative;width:1080px;height:1920px;overflow:hidden;
     background:
       radial-gradient(900px 700px at 85% 18%, rgba(46,197,211,.55), transparent 60%),
       radial-gradient(800px 800px at 10% 85%, rgba(46,197,211,.35), transparent 60%),
       linear-gradient(165deg,#0d4f7c 0%, #082f4f 55%, #051a2c 100%);
     font-family:'Cairo',sans-serif;color:#fff}
  /* bubbles */
  .b{position:absolute;border-radius:50%;
     background:radial-gradient(circle at 32% 28%, rgba(255,255,255,.95) 0 6%, rgba(255,255,255,.25) 14%, rgba(184,243,230,.10) 55%, rgba(255,255,255,.35) 72%, transparent 74%);
     box-shadow: inset 0 0 30px rgba(255,255,255,.18)}
  /* grid lines (research feel) */
  .grid{position:absolute;inset:0;opacity:.07;
     background-image:linear-gradient(#fff 1px,transparent 1px),linear-gradient(90deg,#fff 1px,transparent 1px);
     background-size:90px 90px}
  .top{position:absolute;top:330px;right:90px;left:90px;display:flex;justify-content:space-between;align-items:center}
  .pill{font-family:'IBM Plex Sans Arabic';font-weight:600;font-size:34px;padding:14px 34px;border-radius:999px;
        background:rgba(255,255,255,.1);border:2px solid rgba(255,255,255,.35);backdrop-filter:blur(6px)}
  .pill .dot{display:inline-block;width:16px;height:16px;border-radius:50%;background:var(--lemon);margin-left:14px;vertical-align:middle}
  .ep{font-weight:900;font-size:34px;color:var(--mint);letter-spacing:1px}
  .kicker{position:absolute;top:470px;right:90px;font-size:52px;font-weight:700;color:var(--mint)}
  h1{position:absolute;top:530px;right:84px;left:60px;font-weight:900;line-height:1.05;font-size:200px;letter-spacing:-2px;
     text-shadow:0 10px 40px rgba(0,0,0,.35)}
  h1 .hl{display:inline-block;position:relative;isolation:isolate;color:var(--ink);padding:0 28px 10px;margin-top:10px}
  h1 .hl::before{content:"";position:absolute;inset:18px -6px 6px -6px;background:var(--lemon);border-radius:22px;z-index:-1;transform:rotate(-1.5deg)}
  h1 .hl span{position:relative}
  .q{position:absolute;top:1030px;right:90px;width:560px;font-family:'IBM Plex Sans Arabic';font-weight:600;font-size:54px;line-height:1.35}
  .q b{color:var(--lemon);font-weight:600}
  /* bottle */
  .bottle{position:absolute;left:50px;top:1010px;width:400px;filter:drop-shadow(0 40px 60px rgba(0,0,0,.45))}
  /* mini chart */
  .chart{position:absolute;right:90px;top:1300px;display:flex;align-items:flex-end;gap:22px;height:220px}
  .bar{width:70px;border-radius:14px 14px 4px 4px;background:linear-gradient(180deg,var(--aqua),rgba(46,197,211,.25))}
  .bar.hi{background:linear-gradient(180deg,var(--lemon),rgba(255,216,77,.35))}
  .chart-cap{position:absolute;right:90px;top:1540px;font-family:'IBM Plex Sans Arabic';font-size:30px;color:rgba(255,255,255,.7);
     border-top:2px solid rgba(255,255,255,.25);padding-top:16px;width:480px}
  .cta{position:absolute;bottom:180px;right:90px;left:90px;display:flex;justify-content:space-between;align-items:center;
       font-family:'IBM Plex Sans Arabic';font-size:34px;color:rgba(255,255,255,.8)}
  .cta .swipe{font-weight:600;color:#fff}
</style>
</head>
<body>
<div class="c">
  <div class="grid"></div>

  <div class="b" style="width:220px;height:220px;left:620px;top:120px"></div>
  <div class="b" style="width:90px;height:90px;left:860px;top:820px"></div>
  <div class="b" style="width:140px;height:140px;left:120px;top:640px"></div>
  <div class="b" style="width:60px;height:60px;left:420px;top:780px"></div>
  <div class="b" style="width:300px;height:300px;left:-80px;top:1500px"></div>
  <div class="b" style="width:120px;height:120px;left:760px;top:1720px"></div>
  <div class="b" style="width:46px;height:46px;left:380px;top:1380px"></div>

  <div class="top">
    <div class="pill"><span class="dot"></span>دراسة سوق</div>
    <div class="ep">2026</div>
  </div>

  <div class="kicker">بالأرقام والبيانات</div>
  <h1>سوق<br><span class="hl"><span>المنظفات</span></span></h1>

  <div class="q">كيف يختار المستهلك<br><b>منظّفه</b> فعلاً؟</div>

  <!-- detergent bottle (original SVG) -->
  <svg class="bottle" viewBox="0 0 400 620" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <linearGradient id="body" x1="0" x2="1">
        <stop offset="0" stop-color="#e9fbff"/><stop offset=".45" stop-color="#ffffff"/><stop offset="1" stop-color="#9fdbe6"/>
      </linearGradient>
      <linearGradient id="cap" x1="0" x2="1">
        <stop offset="0" stop-color="#ffe47a"/><stop offset="1" stop-color="#e0b31f"/>
      </linearGradient>
      <linearGradient id="lab" x1="0" x2="0" y1="0" y2="1">
        <stop offset="0" stop-color="#2ec5d3"/><stop offset="1" stop-color="#0a6e8a"/>
      </linearGradient>
    </defs>
    <!-- handle -->
    <path d="M250 120 h70 a40 40 0 0 1 40 40 v120 a40 40 0 0 1 -40 40 h-30" fill="none" stroke="url(#body)" stroke-width="34" stroke-linecap="round"/>
    <!-- cap -->
    <rect x="120" y="20" width="120" height="70" rx="14" fill="url(#cap)"/>
    <rect x="135" y="80" width="90" height="30" rx="6" fill="#d9a917"/>
    <!-- body -->
    <path d="M110 110 h150 q40 0 55 50 l25 90 q10 40 10 80 v200 q0 70 -70 70 h-190 q-70 0 -70 -70 v-200 q0 -40 10 -80 l25 -90 q15 -50 55 -50z" fill="url(#body)"/>
    <!-- label -->
    <rect x="60" y="300" width="260" height="210" rx="26" fill="url(#lab)"/>
    <circle cx="190" cy="370" r="38" fill="#ffd84d"/>
    <path d="M172 372 l12 12 24 -26" stroke="#0a3d62" stroke-width="10" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="100" y="430" width="180" height="16" rx="8" fill="rgba(255,255,255,.85)"/>
    <rect x="130" y="462" width="120" height="12" rx="6" fill="rgba(255,255,255,.55)"/>
    <!-- shine -->
    <path d="M95 200 q-15 60 -15 140" stroke="rgba(255,255,255,.9)" stroke-width="14" fill="none" stroke-linecap="round"/>
  </svg>

  <div class="chart">
    <div class="bar" style="height:110px"></div>
    <div class="bar" style="height:160px"></div>
    <div class="bar hi" style="height:220px"></div>
    <div class="bar" style="height:140px"></div>
    <div class="bar" style="height:80px"></div>
  </div>
  <div class="chart-cap">السعر · الجودة · العلامة · الرائحة · العرض</div>

  <div class="cta">
    <span class="swipe">شاهد النتائج ←</span>
    <span dir="ltr">@your_brand</span>
  </div>
</div>
</body>
</html>
